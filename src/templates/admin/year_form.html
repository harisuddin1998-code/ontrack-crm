
{% extends "base.html" %}
{% block content %}
<div class="o_container_fluid">
    <h1 class="o_page_title"><i class="fas fa-calendar" style="color: var(--odoo-primary);"></i> {{ title }}</h1>
    <div class="o_form_view">
        <div class="o_form_body">
            <form method="POST">
                {{ form.hidden_tag() }}
                <div class="o_form_group">
                    <div class="o_field_group">
                        <label class="o_field_label">{{ form.year.label }}</label>
                        {{ form.year(class="o_field_widget", placeholder="Enter year / model (e.g., 2020)") }}
                    </div>
                </div>
                <div class="o_action_bar">
                    <a href="{{ url_for('admin.years') }}" class="o_button o_button_secondary">Cancel</a>
                    <button type="submit" class="o_icon_btn o_icon_btn_save o_icon_btn_lg" title="{{ title }}" aria-label="{{ title }}"><i class="fas fa-floppy-disk"></i></button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
