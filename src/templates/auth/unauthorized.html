
{% extends "base.html" %}
{% block content %}
<div class="o_container" style="max-width: 500px; margin: 60px auto;">
    <div class="o_form_view">
        <div class="o_form_header" style="background: var(--odoo-danger);">
            <h2 class="o_form_title" style="color: white;">Access Denied</h2>
        </div>
        <div class="o_form_body" style="text-align: center; padding: 40px;">
            <i class="fas fa-lock" style="font-size: 48px; color: var(--odoo-danger);"></i>
            <p style="margin-top: 20px;">You do not have permission to access this page.</p>
            <div class="o_action_bar">
                <a href="{{ url_for('index') }}" class="o_button"><i class="fas fa-home"></i> Go Home</a>

        </div>
    </div>
</div>
{% endblock %}
