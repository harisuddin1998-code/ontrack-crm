name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite takes roughly ten minutes. The ceiling is here so a hung test
    # fails in a quarter of an hour instead of burning the default six hours.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # Restores the pip download cache between runs, keyed on the files
          # below - so a run that changes no dependency skips re-downloading
          # Flask, pandas and the rest.
          cache: pip
          cache-dependency-path: |
            requirements/*.txt
            setup.py

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # dev.txt pulls in base.txt and every pytest plugin the suite needs.
          # Listing test dependencies here as well would be a second place to
          # keep them in step, and the two would eventually disagree.
          pip install -r requirements/dev.txt
          pip install -e .

      - name: Run Test Suite
        run: |
          # The whole suite. This used to name a single file, which ran four
          # tests out of two hundred and left every other test file - auth,
          # payments, recovery, dashboards, notifications - unrun on every
          # push, so CI reported green over code nothing had exercised.
          #
          # addopts is overridden to drop the HTML coverage report from
          # pytest.ini: it writes a directory nobody collects on a runner.
          pytest -o addopts="" -q --cov=src --cov-report=term:skip-covered
