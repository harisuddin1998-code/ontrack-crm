
{% extends "base.html" %}
{% block content %}
<div class="o_container_fluid">
    <h1 class="o_page_title"><i class="fas fa-microchip" style="color: var(--odoo-primary);"></i> Device Types</h1>
    <div class="o_search_bar">
        <a href="{{ url_for('admin.device_add') }}" class="o_icon_btn o_icon_btn_add o_icon_btn_lg" title="Add Device" aria-label="Add Device"><i class="fas fa-plus"></i></a>
    </div>
    <div class="o_list_view">
        <table class="o_list_table">
            <thead class="o_list_header">
                <tr><th>Name</th><th>Actions</th></tr>
            </thead>
            <tbody>
                {% for device in devices %}
                <tr class="o_list_record">
                    <td>{{ device.name }}</td>
                    <td>
                        <a href="{{ url_for('admin.device_edit', id=device.id) }}" class="o_icon_btn o_icon_btn_edit" title="Edit Device" aria-label="Edit Device"><i class="fas fa-pencil-alt"></i></a>
                        <form method="POST" action="{{ url_for('admin.device_delete', id=device.id) }}" style="display:inline;" onsubmit="return confirm('Are you sure?')">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                            <button type="submit" class="o_icon_btn o_icon_btn_delete" title="Delete Device" aria-label="Delete Device"><i class="fas fa-trash"></i></button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="2" style="text-align: center; color: var(--odoo-text-light);">No devices found</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
