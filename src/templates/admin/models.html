
{% extends "base.html" %}
{% block content %}
<div class="o_container_fluid">
    <h1 class="o_page_title"><i class="fas fa-car-side" style="color: var(--odoo-primary);"></i> Vehicle Models</h1>
    <div class="o_search_bar">
        <a href="{{ url_for('admin.model_add') }}" class="o_icon_btn o_icon_btn_add o_icon_btn_lg" title="Add Model" aria-label="Add Model"><i class="fas fa-plus"></i></a>
    </div>
    <div class="o_list_view">
        <table class="o_list_table">
            <thead class="o_list_header">
                <tr><th>Name</th><th>Manufacturer</th><th>Actions</th></tr>
            </thead>
            <tbody>
                {% for model in models %}
                <tr class="o_list_record">
                    <td>{{ model.name }}</td>
                    <td>{{ model.make.name if model.make else '-' }}</td>
                    <td>
                        <a href="{{ url_for('admin.model_edit', id=model.id) }}" class="o_icon_btn o_icon_btn_edit" title="Edit Model" aria-label="Edit Model"><i class="fas fa-pencil-alt"></i></a>
                        <form method="POST" action="{{ url_for('admin.model_delete', id=model.id) }}" style="display:inline;" onsubmit="return confirm('Are you sure?')">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                            <button type="submit" class="o_icon_btn o_icon_btn_delete" title="Delete Model" aria-label="Delete Model"><i class="fas fa-trash"></i></button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="3" style="text-align: center; color: var(--odoo-text-light);">No models found</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
