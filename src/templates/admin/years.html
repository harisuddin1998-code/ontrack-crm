
{% extends "base.html" %}
{% block content %}
<div class="o_container_fluid">
    <h1 class="o_page_title"><i class="fas fa-calendar" style="color: var(--odoo-primary);"></i> Vehicle Years</h1>
    <div class="o_search_bar">
        <a href="{{ url_for('admin.year_add') }}" class="o_icon_btn o_icon_btn_add o_icon_btn_lg" title="Add Year" aria-label="Add Year"><i class="fas fa-plus"></i></a>
    </div>
    <div class="o_list_view">
        <table class="o_list_table">
            <thead class="o_list_header">
                <tr><th>Year / Model</th><th>Actions</th></tr>
            </thead>
            <tbody>
                {% for year in years %}
                <tr class="o_list_record">
                    <td>{{ year.year }}</td>
                    <td>
                        <a href="{{ url_for('admin.year_edit', id=year.id) }}" class="o_icon_btn o_icon_btn_edit" title="Edit Year" aria-label="Edit Year"><i class="fas fa-pencil-alt"></i></a>
                        <form method="POST" action="{{ url_for('admin.year_delete', id=year.id) }}" style="display:inline;" onsubmit="return confirm('Are you sure?')">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                            <button type="submit" class="o_icon_btn o_icon_btn_delete" title="Delete Year" aria-label="Delete Year"><i class="fas fa-trash"></i></button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="2" style="text-align: center; color: var(--odoo-text-light);">No years found</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
