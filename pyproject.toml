[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[project]
name = "on-track-erp"
version = "1.0.0"
description = "ON TRACK Vehicle Tracking Management System"
authors = [
    {name = "ON TRACK Private Limited", email = "cs@on-tracking.com"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Customer Service",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Office/Business",
]

dependencies = [
    "flask>=2.3.0",
    "flask-sqlalchemy>=3.1.0",
    "flask-migrate>=4.0.0",
    "flask-socketio>=5.3.0",
    "flask-wtf>=1.1.0",
    "flask-mail>=0.9.0",
    "flask-cors>=4.0.0",
    "flask-limiter>=3.3.0",
    "flask-caching>=2.1.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "wtforms>=3.0.0",
    "email-validator>=2.1.0",
    "python-dotenv>=1.0.0",
    "python-engineio>=4.0.0",
    "python-socketio>=5.0.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "psycopg2-binary>=2.9.0",
    "pyodbc>=5.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
    "pdfkit>=1.0.0",
    "pytz>=2023.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "gunicorn>=21.0.0",
    "prometheus-flask-exporter>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-flask>=1.2.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "isort>=5.12.0",
    "pre-commit>=3.0.0",
    "tox>=4.0.0",
    "watchdog>=3.0.0",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["migrations/*", "tests/*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=src --cov-report=html --cov-report=term"

[tool.pyright]
include = ["src", "run.py", "tests"]
extraPaths = [".", "src"]
executionEnvironments = [
  { root = "." }
]

[tool.pyrefly]
project-includes = ["src/**", "run.py", "tests/**", "migrations/**"]
project-excludes = ["venv/**", "**/venv/**"]
search-path = ["src"]