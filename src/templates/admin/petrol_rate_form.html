
{% extends "base.html" %}
{% block content %}
<div class="o_container_fluid">
    <h1 class="o_page_title"><i class="fas fa-gas-pump" style="color: var(--odoo-primary);"></i> {{ title }}</h1>
    <div class="o_form_view">
        <div class="o_form_body">
            <form method="POST">
                {{ form.hidden_tag() }}
                <div class="o_form_group">
                    <div class="o_field_group">
                        <label class="o_field_label">{{ form.rate_per_liter.label }}</label>
                        {{ form.rate_per_liter(class="o_field_widget", placeholder="Enter rate per liter") }}
                    </div>
                    <div class="o_field_group">
                        <label class="o_field_label">{{ form.effective_date.label }}</label>
                        {{ form.effective_date(class="o_field_widget", type="date") }}
                    </div>
                </div>
                <div class="o_action_bar">
                    <a href="{{ url_for('admin.petrol_rates') }}" class="o_button o_button_secondary">Cancel</a>
                    <button type="submit" class="o_icon_btn o_icon_btn_save o_icon_btn_lg" title="{{ title }}" aria-label="{{ title }}"><i class="fas fa-floppy-disk"></i></button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
